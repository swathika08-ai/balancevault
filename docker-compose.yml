services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: balancevault
      POSTGRES_PASSWORD: balancevault
      POSTGRES_DB: balancevault
    ports: ["5432:5432"]
  postgres_test:
    image: postgres:16
    environment:
      POSTGRES_USER: balancevault
      POSTGRES_PASSWORD: balancevault
      POSTGRES_DB: balancevault_test
    ports: ["5433:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
